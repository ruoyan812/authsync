<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // 首屏即按设备视口缩放根字号，避免 JS 加载完成前的布局闪烁
      (function () {
        var w = document.documentElement.clientWidth || window.innerWidth || 1280;
        var device = w < 640 ? 'mobile' : w < 1024 ? 'tablet' : 'desktop';
        document.documentElement.setAttribute('data-device', device);
        var ratio = w / 1280;
        ratio = Math.min(Math.max(ratio, 0.82), 1.12);
        var size = Math.min(Math.max(16 * ratio, 13), 18);
        document.documentElement.style.fontSize = size.toFixed(2) + 'px';
      })();
    </script>
    <meta name="description" content="AuthSync - 在浏览器中管理您的两步验证（2FA / TOTP）动态验证码" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="https://img.roooooyan.work/file/favicon.svg" />
    <title>Yanverse · 2FA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
