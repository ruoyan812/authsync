<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AuthSync - 在浏览器中管理您的两步验证（2FA / TOTP）动态验证码" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap"

    />
    <link rel="icon" type="image/svg+xml" href="https://img.roooooyan.work/file/favicon.svg" />
    <title>Yanverse · 2FA</title>
    <!-- 邮箱验证码服务：必须放在 head 内。该脚本以「文档中最后一个 script 标签」

    <script src="https://otp.login.roooooyan.work/otp.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
